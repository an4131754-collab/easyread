[project]
name = "easyread"
version = "1.2.7"
description = "EasyRead：把英文論文讀成易讀的繁體中文——背景翻譯、對照原文、批註筆記、文獻庫"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["paper", "translation", "reader", "arxiv", "llm", "論文翻譯"]
dependencies = [
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "pillow>=10",
  "pypdf>=4",
  "truststore>=0.10",
  "certifi>=2024.8.30",
]

[project.scripts]
easyread = "easyread.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["easyread"]

[tool.setuptools.package-data]
easyread = ["check_tex.js", "web/*", "web/**/*"]
