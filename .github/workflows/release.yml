name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04  # 用老系統打包：24.04 上打的 libpython 要新 glibc，22.04 及更老的機器打不開（AppImage 目錄測試就掛在這）
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install backend build tools and dependencies
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build and package
        run: npm run dist
      - name: Smoke test the frozen backend
        run: python scripts/smoke_backend.py
      - name: Check glibc floor of the bundled libpython
        if: runner.os == 'Linux'
        shell: bash
        # 冒煙測試和打包在同一臺機器上，查不出"打包機 glibc 比使用者新"；1.2.5 就是這樣在 22.04 上打不開
        run: |
          lib="$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_config_var('LIBDIR'), sysconfig.get_config_var('LDLIBRARY')))")"
          need="$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "$lib needs $need"
          [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" = GLIBC_2.35 ] || { echo "::error::libpython needs $need, newer than Ubuntu 22.04"; exit 1; }
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyread-${{ matrix.name }}
          # 只要安裝包本身；dist/electron 裡還有解包後的程式目錄（Mac 的 .app 裡有上百個檔案）
          path: |
            dist/electron/*.exe
            dist/electron/*.dmg
            dist/electron/*.AppImage
          if-no-files-found: error

  release:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
          generate_release_notes: false  # 發版說明手寫，只往已有的 Release 上掛安裝包
