<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyRead</title>
<link rel="icon" href="/web/favicon.svg">
<link rel="stylesheet" href="/web/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/web/css/base.css">
<link rel="stylesheet" href="/web/css/reader.css">
<link rel="stylesheet" href="/web/css/reader-panels.css">
<link rel="stylesheet" href="/web/css/reader-chat.css">
<link rel="stylesheet" href="/web/css/settings.css">
<link rel="stylesheet" href="/web/css/usage.css">
<script>try{var p=JSON.parse((localStorage.getItem("easyread-prefs")||localStorage.getItem("coread-prefs"))||"{}");var d=p.theme==="dark"||(p.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"}catch(e){}</script>
</head>
<body>
<div id="progress" aria-hidden="true"><i></i></div>

<header class="topbar" id="bar">
  <a class="btn brand-back" id="backBtn" href="/" title="迴文獻庫"></a>
  <button class="btn icon" data-act="drawer" title="目錄（T）"></button>
  <div class="bar-titles">
    <span class="bar-title"></span>
    <span class="bar-section"></span>
  </div>
  <span class="grow"></span>
  <span class="job-state" id="jobState"></span>
  <div class="mode-control">
    <div class="seg" role="group" aria-label="顯示">
      <button data-mode="zh" title="只看譯文">譯文</button>
      <button data-mode="bi" title="原文在上、譯文在下（B）">對照</button>
    </div>
    <div class="compare-order" id="compareOrder">
      <button class="compare-order-trigger" type="button" data-compare-menu aria-haspopup="menu" aria-expanded="false" aria-controls="compareOrderMenu" title="選擇對照文字的主次">
        <span data-compare-label>英文為主</span><span class="compare-order-caret" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="m4.5 6.25 3.5 3.5 3.5-3.5"/></svg></span>
      </button>
      <div class="compare-order-menu" id="compareOrderMenu" role="menu" aria-label="對照文字主次" hidden>
        <button type="button" role="menuitemradio" data-compare-primary="en" aria-checked="true">英文原文為主</button>
        <button type="button" role="menuitemradio" data-compare-primary="zh" aria-checked="false">中文譯文為主</button>
      </div>
    </div>
  </div>
  <button class="btn" data-act="pages" title="原文頁，跟隨閱讀位置（O）"></button>
  <button class="btn" data-act="notes" title="筆記面板（M）"></button>
  <button class="btn" data-act="chat" title="邊讀邊問 AI（A）"></button>
  <button class="btn" data-act="settings" title="字號、版心、字型（=、- 調字號）">Aa</button>
  <button class="save-state" data-act="about" title="儲存狀態"><i></i><span>…</span></button>
</header>

<aside id="drawer" aria-label="目錄">
  <div class="drawer-tabs" role="tablist">
    <button data-tab="toc" class="on">目錄</button>
    <button data-tab="terms">術語</button>
    <button data-tab="about">說明</button>
    <button data-tab="recent" class="server-only">最近</button>
  </div>
  <div class="drawer-body"></div>
</aside>
<div id="scrim"></div>

<main id="stage">
  <article id="paper" lang="zh-TW"></article>
  <aside id="margin" aria-label="討論與筆記"></aside>
</main>

<section id="pageview" class="side-panel" aria-label="原文頁">
  <div class="pv-head">
    <button class="btn icon" data-pv="prev" title="上一頁（[）">‹</button>
    <span class="pv-label"></span>
    <button class="btn icon" data-pv="next" title="下一頁（]）">›</button>
    <span class="grow"></span>
    <label class="pv-follow" title="隨閱讀位置翻頁"><input type="checkbox" checked> 跟隨</label>
    <button class="btn sm" data-pv="zoom">放大</button>
    <a class="btn sm" data-pv="pdf" target="_blank" rel="noopener">PDF</a>
    <button class="btn icon" data-pv="close" title="關閉（O）">×</button>
  </div>
  <div class="pv-scroll"><div class="pv-page"><img alt=""><div class="pv-hl"></div></div></div>
</section>

<section id="notespanel" class="side-panel" aria-label="筆記"></section>
<section id="chatpanel" class="side-panel" aria-label="問 AI"></section>
<div class="dialog-backdrop" id="readerDlg"><div class="dialog" role="dialog"></div></div>
<div class="dialog-backdrop" id="settingsDlg"><div class="dialog" role="dialog" aria-label="設定"></div></div>
<div class="dialog-backdrop" id="textDlg"><div class="dialog wide" role="dialog"></div></div>

<div id="settings" class="menu" role="dialog" aria-label="閱讀設定"></div>
<div id="popover" class="popover" role="tooltip"></div>
<div id="selbar" class="popover" role="toolbar"></div>
<div id="blockbar" class="popover" role="toolbar"></div>
<div id="toast" role="status"></div>

<!--PR:DATA-->
<script src="/web/vendor/katex/katex.min.js"></script>
<script src="/web/js/common/util.js"></script>
<script src="/web/js/common/presence.js"></script>
<script src="/web/js/common/confirm.js"></script>
<script src="/web/js/common/features.js"></script>
<script src="/web/js/common/usage.js"></script>
<script src="/web/js/common/theme.js"></script>
<script src="/web/js/common/markup.js"></script>
<script src="/web/js/reader/store.js"></script>
<script src="/web/js/reader/render.js"></script>
<script src="/web/js/reader/margin.js"></script>
<script src="/web/js/reader/anchor.js"></script>
<script src="/web/js/reader/actions.js"></script>
<script src="/web/js/reader/editor.js"></script>
<script src="/web/js/reader/panels.js"></script>
<script src="/web/js/reader/pageview.js"></script>
<script src="/web/js/reader/notespanel.js"></script>
<script src="/web/js/reader/chat.js"></script>
<script src="/web/js/reader/notehelp.js"></script>
<script src="/web/js/reader/jumpback.js"></script>
<script src="/web/js/reader/keys.js"></script>
<script src="/web/js/reader/export.js"></script>
<script src="/web/js/common/settings-models.js"></script>
<script src="/web/js/common/settings-api.js"></script>
<script src="/web/js/common/settings.js"></script>
<script src="/web/js/common/settings-tabs.js"></script>
<script src="/web/js/common/settings-chat.js"></script>
<script src="/web/js/reader/main.js"></script>
</body>
</html>
